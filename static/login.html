<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foodify | Log in</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main>
    <div class="box">
      <h1>🥗 Foodify</h1>
      <p>Log in or create an account.</p>

      <div class="chips">
        <button type="button" id="loginTab">Log in</button>
        <button type="button" id="registerTab">Register</button>
      </div>

      <label for="username">Your name</label>
      <input id="username" type="text" placeholder="Priya">

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="At least 4 characters">

      <p id="authError"></p>
      <button type="button" id="authButton">Log in</button>
    </div>
  </main>

  <script src="login.js"></script>
</body>
</html>
